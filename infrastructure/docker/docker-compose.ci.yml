# CI only (the "ci" castor context): on top of the registry cache pushed by
# `castor docker:push`, the GitHub Actions cache backend is read and written by
# every CI build. The registry cache alone is regularly missed for some layers
# (see https://github.com/jolicode/docker-starter/issues/430).
#
# These entries are silently ignored outside GitHub Actions (buildx needs the
# ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL environment variables, exposed by
# the local .github/actions/expose-github-runtime action in the workflow).
#
# The cache_from entries are appended to the ones of docker-compose.yml. Each
# service and PHP version gets its own scope, otherwise they overwrite each other.

services:
    frontend:
        build:
            cache_from:
                - "type=gha,scope=frontend-php${PHP_VERSION}"
            cache_to:
                - "type=gha,scope=frontend-php${PHP_VERSION},mode=max,ignore-error=true"

    builder:
        build:
            cache_from:
                - "type=gha,scope=builder-php${PHP_VERSION}"
            cache_to:
                - "type=gha,scope=builder-php${PHP_VERSION},mode=max,ignore-error=true"
