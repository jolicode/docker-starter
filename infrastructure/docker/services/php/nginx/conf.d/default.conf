# Site configuration, shared by the dev "frontend" container and the production "nginx"
# image. PHP requests are forwarded to php-fpm through the shared unix socket.
server {
    listen 8080;
    server_name _;
    root /var/www/application/public;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # php-fpm ping, used by the images HEALTHCHECK
    location = /ping {
        access_log off;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
    }

    # Remove this block if you want to access to PHP FPM monitoring
    # dashboard (on URL: /php-fpm-status). WARNING: on production, you must
    # secure this page (by user IP address, with a password, for example)
    location = /php-fpm-status {
        deny all;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_NAME /php-fpm-status;
        fastcgi_param SCRIPT_FILENAME /php-fpm-status;
    }

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # TLS is always terminated upstream (dev router, ingress, reverse proxy)
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_NAME $http_host;
        # # Uncomment if you want to use /php-fpm-status endpoint **with**
        # # real request URI. It may have some side effects, that's why it's
        # # commented by default
        # fastcgi_param SCRIPT_NAME $request_uri;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
