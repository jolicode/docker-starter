# nginx of the dev "frontend" container (Debian package, runs as the host user under runit).
# The site itself is /etc/nginx/conf.d/default.conf, shared with the production image.
user      nginx;
pid       /tmp/nginx.pid;
daemon    off;
error_log /proc/self/fd/2;

include /etc/nginx/modules-enabled/*.conf;

http {
    access_log /proc/self/fd/1;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client_body_temp_path;
    fastcgi_temp_path /tmp/nginx-fastcgi_temp_path;
    proxy_temp_path /tmp/nginx-proxy_temp_path;
    scgi_temp_path /tmp/nginx-scgi_temp_path;
    uwsgi_temp_path /tmp/nginx-uwsgi_temp_path;

    include /etc/nginx/conf.d/*.conf;
}

events {}
