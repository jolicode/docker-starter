; priority=50
; Everything PHP does differently in production compared to the dev "frontend" container
[PHP]
display_errors = Off
; Native file sessions: let PHP garbage collect them (Debian normally relies on a system cron for that)
session.gc_probability = 1

[opcache]
; The code is baked into the image: no need to check files for changes on each request
opcache.validate_timestamps = 0
