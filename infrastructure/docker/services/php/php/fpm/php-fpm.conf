[global]
error_log  = /proc/self/fd/2
daemonize  = no

[www]
; Unix socket shared with nginx: same container in dev (runit), sidecar container in production
; (volume or emptyDir mounted on /var/run/php)
listen = /var/run/php/php-fpm.sock
; nginx does not necessarily run with the same user as php-fpm
listen.mode = 0666
pm = dynamic
pm.max_children = 25
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 3
pm.max_requests = 500
pm.status_path = /php-fpm-status
; Used by the images HEALTHCHECK
ping.path = /ping
clear_env  = no
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
