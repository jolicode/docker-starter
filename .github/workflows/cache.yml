name: Push docker image to registry

"on":
  push:
    # Only run this job when pushing to the main branch
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  DS_REGISTRY: "ghcr.io/jolicode/docker-starter"
  DS_PHP_VERSION: "8.5"

jobs:
  push-images:
    name: Push image to registry
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: setup-castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: "Build and start the infrastructure"
        run: "castor docker:push"
